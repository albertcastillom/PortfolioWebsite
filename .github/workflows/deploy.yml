name: Deploy portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::306320707193:role/portfolio-website-github-deploy
          aws-region: us-east-1
          allowed-account-ids: "306320707193"

      - name: Upload site to S3
        run: >-
          aws s3 sync dist/
          s3://albert-castillo-portfolio-306320707193/
          --delete
          --exclude ".DS_Store"

      - name: Prevent cached HTML releases
        run: >-
          aws s3 cp dist/index.html
          s3://albert-castillo-portfolio-306320707193/index.html
          --cache-control "no-cache, no-store, must-revalidate"
          --content-type "text/html"

      - name: Invalidate CloudFront entry points
        run: >-
          aws cloudfront create-invalidation
          --distribution-id E1WCAHIVOMUD27
          --paths "/" "/index.html"
